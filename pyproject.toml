[project]
name = "myjobquote-mcp"
version = "1.1.0"
description = "Connect MyJobQuote to Claude Code, ChatGPT and any AI agent through Cotlet.dev, a hosted MCP server. No MyJobQuote API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["myjobquote", "myjobquote api", "myjobquote mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/mcp/myjobquote?utm_source=pypi&utm_medium=package&utm_campaign=myjobquote"
Source = "https://github.com/cotlet-connect/myjobquote-mcp"

[project.scripts]
myjobquote-mcp = "myjobquote_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"myjobquote_agent.py" = "myjobquote_agent.py"

[tool.hatch.build.targets.sdist]
include = ["myjobquote_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
